name: Construir APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias web
        working-directory: web
        run: npm ci

      - name: Generar assets (interfaz, clang, Python, Lua...)
        working-directory: web
        run: npm run build

      - name: Pruebas de los motores (C, C++, Python, Lua, JS, Chispa)
        working-directory: web
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Conserva la misma clave de firma entre compilaciones para poder
      # actualizar la app sin desinstalarla.
      - name: Clave de firma de depuracion
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Clave de firma propia (opcional, secretos del repositorio)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/CodigoMovil.apk
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: CodigoMovil-apk
          path: dist/CodigoMovil.apk
          retention-days: 30

      # El APK se publica en "Releases" para descargarlo directamente desde el movil:
      #  - cambios en main  -> "ultima-version"
      #  - PR (o lanzamiento manual) -> "prueba" (version de pruebas)
      - name: Publicar en Releases (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Código Móvil (última versión)
          make_latest: true
          body: |
            APK generado automáticamente desde `main` (compilación ${{ github.run_number }}).
            Descarga **CodigoMovil.apk** desde el móvil e instálalo.
          files: dist/CodigoMovil.apk

      - name: Publicar en Releases (prueba)
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Código Móvil (versión de prueba)
          prerelease: true
          make_latest: false
          body: |
            APK de prueba (compilación ${{ github.run_number }}, commit ${{ github.event.pull_request.head.sha || github.sha }}).
            Descarga **CodigoMovil.apk** desde el móvil e instálalo.
          files: dist/CodigoMovil.apk
